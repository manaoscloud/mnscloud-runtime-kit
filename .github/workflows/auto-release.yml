name: Auto Release

on:
  workflow_call:
    inputs:
      release_script:
        description: "Repository release script to execute."
        required: true
        type: string
      version:
        description: "Optional explicit semantic version. When empty, patch is incremented from VERSION."
        required: false
        type: string
        default: ""
      setup_node:
        description: "Install Node.js dependencies before releasing."
        required: false
        type: boolean
        default: false
      node_version:
        description: "Node.js version."
        required: false
        type: string
        default: "24"
      setup_deno:
        description: "Install Deno before releasing."
        required: false
        type: boolean
        default: true
      deno_version:
        description: "Pinned Deno version used by release jobs."
        required: false
        type: string
        default: "2.8.1"
      checkout_runtime_kit:
        description: "Checkout mnscloud-runtime-kit for repositories that consume the shared release helper."
        required: false
        type: boolean
        default: true
      runtime_kit_ref:
        description: "mnscloud-runtime-kit ref used by consumers."
        required: false
        type: string
        default: "main"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'Release ') }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout runtime kit
        if: ${{ inputs.checkout_runtime_kit }}
        uses: actions/checkout@v6
        with:
          repository: manaoscloud/mnscloud-runtime-kit
          ref: ${{ inputs.runtime_kit_ref }}
          path: .mnscloud-runtime-kit

      - name: Ignore auxiliary runtime kit checkout
        if: ${{ inputs.checkout_runtime_kit }}
        run: echo ".mnscloud-runtime-kit/" >> .git/info/exclude

      - name: Setup Deno
        if: ${{ inputs.setup_deno }}
        shell: bash
        env:
          DENO_VERSION: ${{ inputs.deno_version }}
        run: |
          set -euo pipefail

          case "$(uname -m)" in
            x86_64|amd64) deno_arch="x86_64-unknown-linux-gnu" ;;
            aarch64|arm64) deno_arch="aarch64-unknown-linux-gnu" ;;
            *) echo "Unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac

          install_dir="${RUNNER_TEMP}/deno-${DENO_VERSION}"
          archive="${RUNNER_TEMP}/deno-${DENO_VERSION}.zip"
          url="https://github.com/denoland/deno/releases/download/v${DENO_VERSION}/deno-${deno_arch}.zip"

          rm -rf "$install_dir"
          mkdir -p "$install_dir"

          for attempt in 1 2 3 4 5; do
            if curl -fL --connect-timeout 20 --retry 3 --retry-delay 2 --retry-all-errors \
              -o "$archive" "$url"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Failed to download Deno ${DENO_VERSION} after ${attempt} attempts." >&2
              exit 1
            fi
            sleep "$((attempt * 5))"
          done

          python3 - "$archive" "$install_dir" <<'PY'
          import os
          import stat
          import sys
          import zipfile

          archive, install_dir = sys.argv[1], sys.argv[2]
          with zipfile.ZipFile(archive) as zip_file:
              zip_file.extractall(install_dir)
          deno_bin = os.path.join(install_dir, "deno")
          os.chmod(deno_bin, os.stat(deno_bin).st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)
          PY

          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/deno" --version

      - name: Setup Node.js
        if: ${{ inputs.setup_node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm

      - name: Install Node.js dependencies
        if: ${{ inputs.setup_node }}
        run: npm ci

      - name: Configure git author
        run: |
          git config user.name "mnscloud-release-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          requested="${{ inputs.version }}"
          if [ -n "$requested" ]; then
            version="$requested"
          else
            current="$(tr -d '[:space:]' < VERSION)"
            IFS='.' read -r major minor patch_extra <<< "$current"
            patch="${patch_extra%%[-+]*}"
            if ! [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]; then
              echo "VERSION must be x.y.z when auto-incrementing; found: $current" >&2
              exit 1
            fi
            version="${major}.${minor}.$((patch + 1))"
          fi
          if ! [[ "$version" =~ ^[0-9]+[.][0-9]+[.][0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          MNSCLOUD_RUNTIME_KIT_DIR: ${{ github.workspace }}/.mnscloud-runtime-kit
        run: |
          set -euo pipefail
          bash "${{ inputs.release_script }}" --version "${{ steps.version.outputs.version }}" --publish

      - name: Notify MNSCloud release cache
        id: release_cache
        env:
          MNSCLOUD_RELEASE_SYNC_URL: ${{ vars.MNSCLOUD_RELEASE_SYNC_URL || secrets.MNSCLOUD_RELEASE_SYNC_URL || '' }}
          MNSCLOUD_RELEASE_SYNC_TOKEN: ${{ secrets.MNSCLOUD_RELEASE_SYNC_TOKEN || secrets.MNSCLOUD_DEPLOY_TOKEN || '' }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$MNSCLOUD_RELEASE_SYNC_URL" ] || [ -z "$MNSCLOUD_RELEASE_SYNC_TOKEN" ]; then
            echo "MNSCLOUD_RELEASE_SYNC_URL or MNSCLOUD_RELEASE_SYNC_TOKEN is not configured; release cache notification skipped."
            exit 0
          fi
          set +e
          python3 - <<'PY' > /tmp/mnscloud-release-payload.json
          import json
          import os
          import subprocess

          version = os.environ["RELEASE_VERSION"]
          ref = f"v{version}"
          with open("releases/manifest.json", encoding="utf-8") as handle:
              manifest = json.load(handle)
          product = manifest.get("product")
          supported_products = {
              "mnscloud-agent",
              "mnscloud-api",
              "mnscloud-app",
              "mnscloud-kamailio-softswitch",
              "mnscloud-nginx",
              "mnscloud-rabbitmq",
              "mnscloud-workers",
              "mnscloud-freeradius",
              "mnscloud-freeswitch",
              "mnscloud-asterisk",
              "mnscloud-opensips-sbc",
              "mnscloud-kamailio-webrtc",
              "mnscloud-turn",
              "mnscloud-media",
              "mnscloud-webapps",
          }
          if product not in supported_products:
              raise SystemExit(78)
          channel = "stable"
          stable = manifest.get("channels", {}).get(channel, {})
          released_at = stable.get("releasedAt")
          artifact = stable.get("artifact") or {}
          artifact_name = artifact.get("name")
          artifact_url = None
          if artifact_name:
              repository = os.environ["GITHUB_REPOSITORY"]
              artifact_url = f"https://github.com/{repository}/releases/download/{ref}/{artifact_name}"
          build_ref = subprocess.check_output(
              ["git", "rev-list", "-n", "1", ref],
              text=True,
          ).strip()[:12]
          print(json.dumps({
              "product": product,
              "channel": channel,
              "version": version,
              "ref": ref,
              "buildRef": build_ref,
              "buildDate": released_at,
              "releasedAt": released_at,
              "notes": f"Synced from GitHub Actions release {ref}.",
              "artifactName": artifact_name,
              "artifactUrl": artifact_url,
              "artifactSha256": artifact.get("sha256"),
              "artifactSizeBytes": artifact.get("sizeBytes"),
              "artifactContentType": artifact.get("contentType"),
          }))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"product={product}\n")
              output.write(f"version={version}\n")
              output.write(f"ref={ref}\n")
          PY
          payload_status="$?"
          set -e
          if [ "$payload_status" -eq 78 ]; then
            echo "Product is not managed by the control-plane runtime release cache; notification skipped."
            exit 0
          fi
          if [ "$payload_status" -ne 0 ]; then
            exit "$payload_status"
          fi
          base_url="${MNSCLOUD_RELEASE_SYNC_URL%/}"
          if [[ "$base_url" == */api/v1 ]]; then
            endpoint="${base_url}/runtime/releases/publish"
          else
            endpoint="${base_url}/api/v1/runtime/releases/publish"
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${MNSCLOUD_RELEASE_SYNC_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @/tmp/mnscloud-release-payload.json \
            "$endpoint"

      - name: Queue runtime rollout through MNSCloud Agent
        if: ${{ steps.release_cache.outputs.product != '' }}
        env:
          MNSCLOUD_RUNTIME_ROLLOUT_URL: ${{ vars.MNSCLOUD_RELEASE_SYNC_URL || secrets.MNSCLOUD_RELEASE_SYNC_URL || '' }}
          MNSCLOUD_RUNTIME_ROLLOUT_TOKEN: ${{ secrets.MNSCLOUD_DEPLOY_TOKEN || '' }}
          RUNTIME_PRODUCT: ${{ steps.release_cache.outputs.product }}
          RUNTIME_TARGET_REF: ${{ steps.release_cache.outputs.ref }}
        run: |
          set -euo pipefail
          if [ -z "$MNSCLOUD_RUNTIME_ROLLOUT_URL" ] || [ -z "$MNSCLOUD_RUNTIME_ROLLOUT_TOKEN" ]; then
            echo "MNSCLOUD_RELEASE_SYNC_URL and MNSCLOUD_DEPLOY_TOKEN are required to queue the runtime rollout." >&2
            exit 1
          fi
          case "$RUNTIME_PRODUCT" in
            mnscloud-agent|mnscloud-api|mnscloud-app|mnscloud-kamailio-softswitch|mnscloud-nginx|mnscloud-rabbitmq|mnscloud-workers|mnscloud-freeradius|mnscloud-freeswitch|mnscloud-asterisk|mnscloud-opensips-sbc|mnscloud-kamailio-webrtc|mnscloud-turn|mnscloud-media|mnscloud-webapps) ;;
            *)
              echo "Product ${RUNTIME_PRODUCT} is not supported for Agent-driven runtime rollout; rollout skipped."
              exit 0
              ;;
          esac
          base_url="${MNSCLOUD_RUNTIME_ROLLOUT_URL%/}"
          [[ "$base_url" == */api/v1 ]] || base_url="${base_url}/api/v1"
          sudo apt-get update
          sudo apt-get install -y jq curl
          curl -fsS -X POST \
            -H "Authorization: Bearer ${MNSCLOUD_RUNTIME_ROLLOUT_TOKEN}" \
            -H "Content-Type: application/json" \
            "${base_url}/monitoring/agents/runtime-products/${RUNTIME_PRODUCT}/update" |
            tee /tmp/mnscloud-runtime-rollout.json
          rollout_status="$(jq -r '.data.rollout.status // empty' /tmp/mnscloud-runtime-rollout.json)"
          if [ "$rollout_status" = "current" ]; then
            echo "${RUNTIME_PRODUCT} is already current at ${RUNTIME_TARGET_REF}."
            exit 0
          fi
          for attempt in $(seq 1 60); do
            sleep 10
            curl -fsS \
              -H "Authorization: Bearer ${MNSCLOUD_RUNTIME_ROLLOUT_TOKEN}" \
              "${base_url}/monitoring/agents/runtime-products/${RUNTIME_PRODUCT}" \
              > /tmp/mnscloud-runtime-product.json
            jq -r '.data.nodes[]? | "\(.name // .hostname // .agentUUID) \(.updateStatus) \(.installedVersion // "-") -> \(.latestVersion // "-")"' /tmp/mnscloud-runtime-product.json
            status="$(jq -r '.data.rolloutStatus // empty' /tmp/mnscloud-runtime-product.json)"
            pending="$(jq -r '.data.pendingCount // 0' /tmp/mnscloud-runtime-product.json)"
            running="$(jq -r '.data.runningCount // 0' /tmp/mnscloud-runtime-product.json)"
            failed="$(jq -r '.data.failedCount // 0' /tmp/mnscloud-runtime-product.json)"
            outdated="$(jq -r '.data.outdatedCount // 0' /tmp/mnscloud-runtime-product.json)"
            unknown="$(jq -r '.data.unknownCount // 0' /tmp/mnscloud-runtime-product.json)"
            if [ "$failed" != "0" ]; then
              echo "${RUNTIME_PRODUCT} runtime rollout failed for one or more Agents." >&2
              exit 1
            fi
            if [ "$pending" = "0" ] && [ "$running" = "0" ] && [ "$outdated" = "0" ] && [ "$unknown" = "0" ] && [ "$status" = "current" ]; then
              echo "${RUNTIME_PRODUCT} runtime rollout completed at ${RUNTIME_TARGET_REF}."
              exit 0
            fi
            echo "${RUNTIME_PRODUCT} rollout still ${status:-unknown}; pending=${pending} running=${running} outdated=${outdated} unknown=${unknown} attempt=${attempt}/60."
          done
          echo "${RUNTIME_PRODUCT} runtime rollout did not reach a terminal healthy state before timeout." >&2
          exit 1
