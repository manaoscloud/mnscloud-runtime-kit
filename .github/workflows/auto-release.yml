name: Auto Release

on:
  workflow_call:
    inputs:
      release_script:
        description: "Repository release script to execute."
        required: true
        type: string
      version:
        description: "Optional explicit semantic version. When empty, patch is incremented from VERSION."
        required: false
        type: string
        default: ""
      setup_node:
        description: "Install Node.js dependencies before releasing."
        required: false
        type: boolean
        default: false
      node_version:
        description: "Node.js version."
        required: false
        type: string
        default: "24"
      setup_deno:
        description: "Install Deno before releasing."
        required: false
        type: boolean
        default: true
      deno_version:
        description: "Pinned Deno version used by release jobs."
        required: false
        type: string
        default: "2.8.1"
      setup_flutter:
        description: "Install the Flutter SDK before releasing (for repositories that build web artifacts)."
        required: false
        type: boolean
        default: false
      flutter_channel:
        description: "Flutter release channel used when setup_flutter is true."
        required: false
        type: string
        default: "stable"
      flutter_version:
        description: "Optional pinned Flutter version used when setup_flutter is true. Empty uses the latest of flutter_channel."
        required: false
        type: string
        default: ""
      checkout_runtime_kit:
        description: "Checkout mnscloud-runtime-kit for repositories that consume the shared release helper."
        required: false
        type: boolean
        default: true
      runtime_kit_ref:
        description: "mnscloud-runtime-kit ref used by consumers."
        required: false
        type: string
        default: "main"
      tag_only:
        description: "Protected main: publish only the release tag (its commit carries the metadata) and increment from the latest tag instead of VERSION."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'Release ') }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout runtime kit
        if: ${{ inputs.checkout_runtime_kit }}
        uses: actions/checkout@v6
        with:
          repository: manaoscloud/mnscloud-runtime-kit
          ref: ${{ inputs.runtime_kit_ref }}
          path: .mnscloud-runtime-kit

      - name: Checkout release cache helper
        if: ${{ !inputs.checkout_runtime_kit }}
        uses: actions/checkout@v6
        with:
          repository: manaoscloud/mnscloud-runtime-kit
          ref: ${{ inputs.runtime_kit_ref }}
          path: .mnscloud-runtime-kit
          sparse-checkout: scripts/notify-release-cache.sh
          sparse-checkout-cone-mode: false

      - name: Ignore auxiliary runtime kit checkout
        run: echo ".mnscloud-runtime-kit/" >> .git/info/exclude

      - name: Setup Deno
        if: ${{ inputs.setup_deno }}
        shell: bash
        env:
          DENO_VERSION: ${{ inputs.deno_version }}
        run: |
          set -euo pipefail

          case "$(uname -m)" in
            x86_64|amd64) deno_arch="x86_64-unknown-linux-gnu" ;;
            aarch64|arm64) deno_arch="aarch64-unknown-linux-gnu" ;;
            *) echo "Unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac

          install_dir="${RUNNER_TEMP}/deno-${DENO_VERSION}"
          archive="${RUNNER_TEMP}/deno-${DENO_VERSION}.zip"
          url="https://github.com/denoland/deno/releases/download/v${DENO_VERSION}/deno-${deno_arch}.zip"

          rm -rf "$install_dir"
          mkdir -p "$install_dir"

          for attempt in 1 2 3 4 5; do
            if curl --proto '=https' --tlsv1.2 -fL --connect-timeout 20 --retry 3 --retry-delay 2 --retry-all-errors \
              -o "$archive" "$url"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Failed to download Deno ${DENO_VERSION} after ${attempt} attempts." >&2
              exit 1
            fi
            sleep "$((attempt * 5))"
          done

          python3 - "$archive" "$install_dir" <<'PY'
          import os
          import stat
          import sys
          import zipfile

          archive, install_dir = sys.argv[1], sys.argv[2]
          with zipfile.ZipFile(archive) as zip_file:
              zip_file.extractall(install_dir)
          deno_bin = os.path.join(install_dir, "deno")
          os.chmod(deno_bin, os.stat(deno_bin).st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)
          PY

          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/deno" --version

      - name: Setup Node.js
        if: ${{ inputs.setup_node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm

      - name: Install Node.js dependencies
        if: ${{ inputs.setup_node }}
        run: npm ci --ignore-scripts

      - name: Setup Flutter
        if: ${{ inputs.setup_flutter }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: ${{ inputs.flutter_channel }}
          flutter-version: ${{ inputs.flutter_version }}
          cache: true

      - name: Configure git author
        run: |
          git config user.name "mnscloud-release-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          requested="${{ inputs.version }}"
          if [ -n "$requested" ]; then
            version="$requested"
          else
            current="$(tr -d '[:space:]' < VERSION)"
            if [ "${{ inputs.tag_only }}" = "true" ]; then
              # main never receives the release commit: the latest x.y.z tag is the current version.
              latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 | sed 's/^v//')"
              [ -z "$latest" ] || current="$latest"
            fi
            IFS='.' read -r major minor patch_extra <<< "$current"
            patch="${patch_extra%%[-+]*}"
            if ! [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]; then
              echo "VERSION must be x.y.z when auto-incrementing; found: $current" >&2
              exit 1
            fi
            version="${major}.${minor}.$((patch + 1))"
          fi
          if ! [[ "$version" =~ ^[0-9]+[.][0-9]+[.][0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          MNSCLOUD_RUNTIME_KIT_DIR: ${{ github.workspace }}/.mnscloud-runtime-kit
          MRTK_RELEASE_TAG_ONLY: ${{ inputs.tag_only && '1' || '0' }}
        run: |
          set -euo pipefail
          bash "${{ inputs.release_script }}" --version "${{ steps.version.outputs.version }}" --publish

      - name: Notify MNSCloud release cache
        id: release_cache
        env:
          MNSCLOUD_RELEASE_SYNC_URL: ${{ vars.MNSCLOUD_RELEASE_SYNC_URL || secrets.MNSCLOUD_RELEASE_SYNC_URL || '' }}
          MNSCLOUD_RELEASE_SYNC_TOKEN: ${{ secrets.MNSCLOUD_RELEASE_SYNC_TOKEN || secrets.MNSCLOUD_DEPLOY_TOKEN || '' }}
        run: bash "${{ github.workspace }}/.mnscloud-runtime-kit/scripts/notify-release-cache.sh" --version "${{ steps.version.outputs.version }}"
