name: Sync release cache

# Reusable: publish an existing GitHub release of the calling repository to the MNSCloud runtime
# release cache (DEV registry). Used to register releases made before a product was managed by the
# cache, or after a failed notification. The production registry is filled by the production
# promotion, never by this workflow.
on:
  workflow_call:
    inputs:
      ref:
        description: "Release tag to publish (vX.Y.Z). Empty uses the latest GitHub release."
        required: false
        type: string
        default: ""
      runtime_kit_ref:
        description: "mnscloud-runtime-kit ref providing the notification helper."
        required: false
        type: string
        default: "main"

permissions:
  contents: read

jobs:
  sync:
    name: Publish release to the runtime release cache
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve release
        id: release
        run: |
          set -euo pipefail
          ref='${{ inputs.ref }}'
          if [ -z "$ref" ]; then
            ref="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          fi
          [[ "$ref" =~ ^v[0-9]+[.][0-9]+[.][0-9]+([-+][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid release ref: $ref" >&2; exit 2; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout release
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.ref }}
          fetch-depth: 0

      - name: Checkout release cache helper
        uses: actions/checkout@v6
        with:
          repository: manaoscloud/mnscloud-runtime-kit
          ref: ${{ inputs.runtime_kit_ref }}
          path: .mnscloud-runtime-kit
          sparse-checkout: scripts/notify-release-cache.sh
          sparse-checkout-cone-mode: false

      - name: Notify MNSCloud release cache
        env:
          MNSCLOUD_RELEASE_SYNC_URL: ${{ vars.MNSCLOUD_RELEASE_SYNC_URL || secrets.MNSCLOUD_RELEASE_SYNC_URL || '' }}
          MNSCLOUD_RELEASE_SYNC_TOKEN: ${{ secrets.MNSCLOUD_RELEASE_SYNC_TOKEN || secrets.MNSCLOUD_DEPLOY_TOKEN || '' }}
        run: bash .mnscloud-runtime-kit/scripts/notify-release-cache.sh --version "${{ steps.release.outputs.version }}"
